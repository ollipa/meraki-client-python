# Override OpenAPI spec issues that need to be reported to Meraki.
# Codegen logs warnings if these appear fixed in the spec.
#
# Available overrides:
# - force_array_response: Endpoints where spec says object but API returns array
# - force_paginated: Endpoints missing pagination params but endpoint returns a list of items.
# - force_paginated_items_schema: Endpoints where paginated wrapper is incorrectly modeled as
#   array[object{items, meta}] in the spec
# - optional_response: Endpoints where response can be None
# - skip_tests: Endpoints to skip in test generation
# - [operationId] response = {...}: Field type overrides for response schemas
# - [operationId] required = [...]: Fields to mark as required (list of field paths)
# - [operationId] extra_fields = {...}: Add fields missing from spec
# - [operationId] inject_response_schema = "...": JSON string defining the full response schema
#   when the spec has a bare {type: object} with no properties

# Endpoints where spec says object but API returns array
force_array_response = ["getAdministeredLicensingSubscriptionEntitlements"]

# Endpoints missing pagination params but return paginated responses
force_paginated = [
    "getOrganizationApplianceDnsLocalProfiles",
    "getOrganizationApplianceDnsLocalRecords",
    "getOrganizationApplianceDnsSplitProfiles",
    "getOrganizationEarlyAccessFeaturesOptIns",
    "getOrganizationWebhooksAlertTypes",
    "getNetworkWirelessRfProfiles",
    "getOrganizationCellularGatewayEsimsServiceProvidersAccounts",
]

# Endpoints where spec incorrectly models paginated wrapper as array[{items, meta}]
force_paginated_items_schema = [
    "getOrganizationCellularGatewayEsimsServiceProvidersAccounts",
    "getOrganizationFloorPlansAutoLocateDevices",
    "getOrganizationFloorPlansAutoLocateStatuses",
    "getOrganizationSmSentryPoliciesAssignmentsByNetwork",
    "getOrganizationWirelessDevicesRadsecCertificatesAuthorities",
    "getOrganizationWirelessRfProfilesAssignmentsByDevice",
    "getOrganizationWirelessControllerDevicesRedundancyFailoverHistory",
]

# Endpoints where response can be None
# Only implemented for GET requests currently
optional_response = ["getDeviceAppliancePerformance"]

# Endpoints to skip in test generation
skip_tests = [
    # Test data difficult to provide
    # Requires one of: username, email, mac...
    "getNetworkPiiPiiKeys",
    "getNetworkPiiRequests",
    "getNetworkPiiSmDevicesForKey",
    "getNetworkPiiSmOwnersForKey",
    # Please specify either timespan or t0
    "getNetworkTraffic",
    "getDeviceWirelessConnectionStats",
    "getDeviceWirelessLatencyStats",
    "getNetworkWirelessClientsConnectionStats",
    "getNetworkWirelessClientsLatencyStats",
    "getNetworkWirelessConnectionStats",
    "getNetworkWirelessDevicesConnectionStats",
    "getNetworkWirelessDevicesLatencyStats",
    "getNetworkWirelessFailedConnections",
    "getNetworkWirelessLatencyStats",
    # Must specify a device or network client
    "getNetworkWirelessChannelUtilizationHistory",
    "getNetworkWirelessSignalQualityHistory",
    "getNetworkWirelessUsageHistory",
    # productType is required
    "getNetworkEvents",
    # Event not found or network not authorized
    "getNetworkFirmwareUpgradesStagedEvents",
]

[getNetworkClients]
response = { firstSeen = "datetime", lastSeen = "datetime" }

[getOrganizationClientsBandwidthUsageHistory]
response = { upstream = "float", downstream = "float", total = "float" }

[getNetworkApplianceVlans]
response = { id = "int" }

[getNetworkWirelessMeshStatuses]
response = { "latestMeshPerformance.mbps" = "float" }

[getNetworkFirmwareUpgrades]
# The field is either a datetime or empty string
response = { "products.wireless.nextUpgrade.time" = "str" }

[getOrganization]
required = ["id", "name", "url"]

[getOrganizations]
required = ["id", "name", "url"]

[getNetwork]
required = ["id", "organizationId", "name", "url"]

[getOrganizationNetworks]
required = ["id", "organizationId", "name", "url"]

[getOrganizationDevices]
required = ["serial", "mac", "model"]
extra_fields = { url = "str" }

[getOrganizationAdmins]
required = ["id", "name", "email"]

[getOrganizationInventoryDevices]
required = ["serial", "mac", "model"]

[getOrganizationDevicesStatuses]
required = ["serial", "mac", "model", "status"]

[getNetworkWirelessSsids]
extra_fields = { dot11w = "dict[str, Any]", dot11r = "dict[str, Any]" }

[getDevice]
required = ["serial", "mac", "model"]
extra_fields = { url = "str" }

[getNetworkApplianceFirewallL3FirewallRules]
# Response schema is missing from spec (bare {type: object})
inject_response_schema = """
{
  "type": "object",
  "properties": {
    "rules": {
      "type": "array",
      "items": {
        "type": "object",
        "properties": {
          "comment":        {"type": "string"},
          "policy":         {"type": "string"},
          "protocol":       {"type": "string"},
          "destPort":       {"type": "string"},
          "destCidr":       {"type": "string"},
          "srcPort":        {"type": "string"},
          "srcCidr":        {"type": "string"},
          "syslogEnabled":  {"type": "boolean"}
        }
      }
    }
  }
}
"""

[getOrganizationApplianceUplinkStatuses]
required = [
    "networkId",
    "serial",
    "model",
    "lastReportedAt",
    "uplinks.interface",
    "uplinks.status",
]
