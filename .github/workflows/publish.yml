name: Publish

# Only pushes to main can publish. There is deliberately no release-event trigger: a release
# event runs the workflow file from the tagged commit, which may not be on main.
# PyPI trusted publishing is bound to this file and the pypi environment.
# A release always changes the version in pyproject.toml, so other pushes don't run this
# workflow; ci.yml lints them.
on:
  push:
    branches: [main]
    paths: [pyproject.toml]

permissions:
  contents: read

jobs:
  # Releases when a push to main (a merged release PR) changes the version to one that has no
  # tag yet. Other pushes skip the remaining jobs.
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify commit is on main branch
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit $GITHUB_SHA is not on the main branch."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Determine release tag
        id: tag
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          VERSION=$(uv version --short)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "pyproject.toml version '$VERSION' is not of the form X.Y.Z."
            exit 1
          fi
          TAG="v$VERSION"

          # Only the push that changed the version releases, so later merges to main can't
          # publish their code under a pending version. Compare with main before the push, not
          # HEAD^1: a rebase-merged release PR can have commits after the version bump.
          if ! git cat-file -e "$BEFORE_SHA^{commit}" 2> /dev/null; then
            echo "Commit $BEFORE_SHA from before the push is not available."
            exit 1
          fi
          PREV=$(git show "$BEFORE_SHA:pyproject.toml" | sed -n 's/^version = "\(.*\)"$/\1/p')
          if [ "$PREV" = "$VERSION" ]; then
            echo "Version $VERSION is unchanged; nothing to release."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The checkout above fetched all tags.
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG already exists; nothing to release."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST=$(git tag -l 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "Version $VERSION is lower than the latest released version $LATEST."
            exit 1
          fi

          # Fail before publishing if the GitHub release step would fail.
          python3 -I scripts/release_notes.py "$VERSION" > /dev/null

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # Gates the release on lint. ci.yml also lints every push to main, but jobs here can't depend
  # on another workflow's jobs, so lint runs again only for pushes that release.
  lint:
    if: needs.check.outputs.tag != ''
    needs: check
    uses: ./.github/workflows/ci.yml

  build:
    needs: [check, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Build package
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Kept minimal: this is the only job with permission to publish to PyPI.
  # The pypi environment requires manual approval before this job runs.
  publish:
    if: needs.check.outputs.tag != ''
    needs: [check, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/meraki-client/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # Tags and creates the GitHub release after the package has been published.
  # If this job fails, re-run the failed jobs of the same workflow run.
  github-release:
    if: needs.check.outputs.tag != ''
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md
            scripts/release_notes.py
          sparse-checkout-cone-mode: false

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          python3 -I scripts/release_notes.py "${TAG#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
