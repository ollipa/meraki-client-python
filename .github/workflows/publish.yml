name: Publish to PyPI

on:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to publish (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Verify version matches tag
        run: |
          UV_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          RELEASE_TAG=${{ inputs.release_tag }}
          CLEAN_TAG=${RELEASE_TAG#v}
          if [ "$UV_VERSION" != "$CLEAN_TAG" ]; then
            echo "Version mismatch!"
            echo "pyproject.toml version: $UV_VERSION"
            echo "Release tag: $RELEASE_TAG"
            exit 1
          fi

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
